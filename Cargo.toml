[package]
name = "nexawal-explorer"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "A no-JavaScript Monero explorer backed by Cuprate or monerod RPC"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "query", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
monero-oxide = { git = "https://github.com/cacaosteve/monero-oxide", rev = "34201e58bf008f5ae66a2393d164837ec54b3405", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
overflow-checks = true
